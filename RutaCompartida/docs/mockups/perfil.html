<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RutaCompartida — Mi perfil</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    nav { background: #0d6efd; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
    nav a { color: white; text-decoration: none; margin-left: 16px; }
    .alerta-ok { background: #d1e7dd; color: #0a3622; border: 1px solid #a3cfbb; border-radius: 4px; padding: 10px; margin: 16px 0; font-size: 14px; }
    .perfil { display: flex; gap: 32px; margin-top: 24px; }
    .avatar { text-align: center; }
    .avatar img { width: 100px; height: 100px; border-radius: 50%; background: #dee2e6; object-fit: cover; }
    .avatar label { display: block; margin-top: 8px; font-size: 13px; color: #0d6efd; cursor: pointer; }
    .formulario { flex: 1; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #444; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .fila { display: flex; gap: 12px; }
    .fila > div { flex: 1; }
    button { margin-top: 24px; padding: 10px 24px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <nav>
    <strong>🚗 RutaCompartida</strong>
    <span>
      <a href="inicio.html">Inicio</a>
      <a href="#">Mis viajes</a>
      <a href="#">Cerrar sesión</a>
    </span>
  </nav>

  <h2>Mi perfil</h2>

  <!-- Aparece tras guardar cambios -->
  <div class="alerta-ok">Perfil actualizado correctamente.</div>

  <div class="perfil">

    <!-- Columna izquierda: avatar -->
    <div class="avatar">
      <img src="https://via.placeholder.com/100" alt="Avatar">
      <label>Cambiar foto</label>
      <small style="display:block; color:#888; font-size:12px;">jpg/png, máx. 2 MB</small>
    </div>

    <!-- Columna derecha: formulario -->
    <div class="formulario">

      <label>Nombre
        <input type="text" value="Carlos García">
      </label>

      <label>Email (no se puede cambiar)
        <input type="email" value="carlos@ejemplo.com" disabled style="background:#f8f9fa;">
      </label>

      <label>Teléfono (opcional)
        <input type="tel" placeholder="Ej: 600 000 000">
      </label>

      <div class="fila">
        <div>
          <label>Modelo de coche
            <input type="text" placeholder="Ej: Seat Ibiza">
          </label>
        </div>
        <div>
          <label>Consumo (l/100 km)
            <input type="number" value="6.5" step="0.1" min="3" max="20">
          </label>
        </div>
      </div>

      <button>Guardar cambios</button>
    </div>

  </div>

</body>
</html>
