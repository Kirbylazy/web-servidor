<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RutaCompartida — Iniciar sesión</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    nav { background: #0d6efd; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
    nav a { color: white; text-decoration: none; margin-left: 16px; }
    .caja { max-width: 420px; margin: 40px auto; border: 1px solid #dee2e6; border-radius: 8px; padding: 32px; }
    .caja h2 { margin-top: 0; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #444; }
    input[type="email"], input[type="password"] { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .alerta { background: #f8d7da; color: #842029; border: 1px solid #f5c2c7; border-radius: 4px; padding: 10px; margin-bottom: 16px; font-size: 14px; }
    .recordar { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 14px; }
    button { width: 100%; margin-top: 24px; padding: 12px; background: #0d6efd; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    .pie { text-align: center; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>

  <nav>
    <strong>🚗 RutaCompartida</strong>
    <span>
      <a href="registro.html">Registrarse</a>
    </span>
  </nav>

  <div class="caja">
    <h2>Iniciar sesión</h2>

    <!-- Este bloque solo aparece si las credenciales son incorrectas -->
    <div class="alerta">Email o contraseña incorrectos.</div>

    <label>Email
      <input type="email" placeholder="correo@ejemplo.com">
    </label>

    <label>Contraseña
      <input type="password" placeholder="••••••••">
    </label>

    <div class="recordar">
      <input type="checkbox" id="recordar">
      <label for="recordar" style="margin:0">Recuérdame</label>
    </div>

    <button>Entrar</button>

    <p class="pie">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
  </div>

</body>
</html>
