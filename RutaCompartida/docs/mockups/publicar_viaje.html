<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RutaCompartida — Publicar viaje</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
    nav { background: #0d6efd; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-radius: 6px; }
    nav a { color: white; text-decoration: none; margin-left: 16px; }
    .pasos { display: flex; gap: 0; margin: 24px 0; }
    .paso { flex: 1; text-align: center; padding: 10px; border: 1px solid #dee2e6; font-size: 13px; background: #f8f9fa; }
    .paso.activo { background: #0d6efd; color: white; border-color: #0d6efd; font-weight: bold; }
    .paso.hecho { background: #d1e7dd; color: #0a3622; border-color: #a3cfbb; }
    .mapa { background: #e9ecef; height: 220px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #888; margin: 16px 0; border: 1px solid #dee2e6; }
    label { display: block; margin-top: 16px; font-size: 14px; color: #444; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .fila { display: flex; gap: 12px; }
    .fila > div { flex: 1; }
    .botones { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    button.secondary { padding: 10px 20px; background: white; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; }
    button.primary { padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .precio-info { background: #fff3cd; border: 1px solid #ffc107; border-radius: 6px; padding: 12px; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>

  <nav>
    <strong>🚗 RutaCompartida</strong>
    <span>
      <a href="inicio.html">Inicio</a>
      <a href="#">Cerrar sesión</a>
    </span>
  </nav>

  <h2>Publicar un viaje</h2>

  <!-- Indicador de pasos -->
  <div class="pasos">
    <div class="paso hecho">1. Ruta</div>
    <div class="paso hecho">2. Mapa</div>
    <div class="paso activo">3. Detalles</div>
    <div class="paso">4. Resumen</div>
  </div>

  <!-- Paso 1 y 2: origen, destino y mapa (ya completados en este mockup) -->
  <div class="fila">
    <div>
      <label>Origen
        <input type="text" value="Sevilla" disabled style="background:#f8f9fa;">
      </label>
    </div>
    <div>
      <label>Destino
        <input type="text" value="Madrid" disabled style="background:#f8f9fa;">
      </label>
    </div>
  </div>

  <div class="mapa">[Mapa con la ruta dibujada · 530 km · ~5h 20min]</div>

  <!-- Paso 3: detalles -->
  <div class="fila">
    <div>
      <label>Fecha
        <input type="date" value="2026-11-12">
      </label>
    </div>
    <div>
      <label>Hora
        <input type="time" value="08:00">
      </label>
    </div>
    <div>
      <label>Plazas (1–8)
        <input type="number" value="3" min="1" max="8">
      </label>
    </div>
  </div>

  <label>Comentarios (opcional)
    <textarea rows="3" placeholder="Ej: No fumar, admito mascotas pequeñas…"></textarea>
  </label>

  <div class="precio-info">
    💡 <strong>Precio sugerido: 13,50 € por plaza</strong><br>
    Puedes ajustarlo entre 9,45 € (70 %) y 16,20 € (120 %).
    <label style="margin-top:10px;">Tu precio por plaza (€)
      <input type="number" value="13.50" step="0.50" min="9.45" max="16.20" style="width:120px;">
    </label>
  </div>

  <div class="botones">
    <button class="secondary">← Atrás</button>
    <button class="primary">Ver resumen →</button>
  </div>

</body>
</html>
